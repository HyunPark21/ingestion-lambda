name: PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Print secret
        run: echo "API KEY is set"
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: echo $NEWS_API_KEY

      - name: Build Docker image
        run: docker build -t trend-app .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run handler locally
        run: |
          python -c "from ingestion.fetch_data import collect_all; print('OK')"