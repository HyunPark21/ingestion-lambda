name: Deploy to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::702197978379:role/git_hub_to_execute_lamda
        aws-region: us-east-1


    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push
      run: |
        docker build -t trend-app .
        docker tag trend-app:latest 702197978379.dkr.ecr.us-east-1.amazonaws.com/hello_world_docker:latest
        docker push 702197978379.dkr.ecr.us-east-1.amazonaws.com/hello_world_docker:latest
