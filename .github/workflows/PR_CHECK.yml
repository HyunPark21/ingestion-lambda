name: PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t trend-app .

      - name: Run handler locally
        run: |
          python -c "from lambda.handler import lambda_handler; print(lambda_handler({}, None))"